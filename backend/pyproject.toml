[project]
name = "genai-hr-platform"
version = "0.1.0"
description = "AI-powered HR management platform with RAG chatbot, resume screening, and employee self-service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "flask-jwt-extended>=4.7.1",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-security-too>=5.6.2",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "werkzeug>=3.1.3",
    "google-genai>=1.0.0",
    "pypdf>=4.3.1",
    "python-docx>=1.1.0",
    "apscheduler>=3.10.1",
    "reportlab>=4.0.0",
    "numpy>=2.0.0",
    "openai>=1.50.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.0",
    "setuptools>=70.0.0,<80",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length
    "E402",  # module level import not at top
]

