# Copy to config.yaml (git-ignored). Environment variables (SECRET_KEY, DATABASE_URL, GEMINI_API_KEY) override these.
env:
  secret_key: change-me
  debug: false

database:
  url: sqlite:///app.db

security:
  password_salt: change-me-too
  registerable: false
  send_register_email: false
  username_enable: false
  username_required: false

